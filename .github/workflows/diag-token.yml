name: Diagnose token permissions

on:
  push:
    branches: [arena/1e2cf108-min2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe release creation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="diag-${GITHUB_RUN_ID}"
          RESP_FILE="$RUNNER_TEMP/resp.txt"
          STATUS=$(curl -s -o "$RESP_FILE" -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"diag\",\"draft\":true,\"target_commitish\":\"$GITHUB_SHA\"}")
          echo "release-create HTTP ${STATUS}"
          echo "::warning title=probe-status::release-create HTTP ${STATUS}"
          echo "::warning title=probe-body::$(tr -d '\n' < "$RESP_FILE" | cut -c1-400)"
          ID=$(python3 -c "import json,sys; print(json.load(open('$RESP_FILE')).get('id',''))" 2>/dev/null)
          if [ -n "$ID" ]; then
            curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/$ID"
            echo "draft deleted"
          fi
          echo "::warning title=probe-perms::$(curl -s -D - -o /dev/null -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/${GITHUB_REPOSITORY} | grep -i -E 'x-accepted-github-permissions|x-oauth-scopes' | tr -d '\r' | tr '\n' ' ')"
          exit 0
