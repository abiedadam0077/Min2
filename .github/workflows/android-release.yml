name: Android build and release

on:
  push:
    branches:
      - arena/1e2cf108-min2
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"
  JAVA_VERSION: "17"
  RELEASE_BRANCHES: "arena/1e2cf108-min2 main"

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Flutter toolchain
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test

  build:
    name: Build release APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve build metadata
        id: meta
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n 1)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          if [ -n "${GOOGLE_OAUTH_CLIENT_ID:-}" ]; then
            PREFIX="${GOOGLE_OAUTH_CLIENT_ID%.apps.googleusercontent.com}"
            echo "GOOGLE_REDIRECT_SCHEME=com.googleusercontent.apps.${PREFIX,,}" >> "$GITHUB_ENV"
          fi

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No release keystore configured; the APK will be signed with the debug key."
            exit 0
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/voxelops-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release \
            --dart-define=GOOGLE_OAUTH_CLIENT_ID="${GOOGLE_OAUTH_CLIENT_ID:-}" \
            --dart-define=GITHUB_OAUTH_CLIENT_ID="${GITHUB_OAUTH_CLIENT_ID:-}" \
            --dart-define=APP_VERSION="${APP_VERSION}" \
            --dart-define=APP_BUILD="${GITHUB_RUN_NUMBER}"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          cp "$SOURCE" dist/VoxelOps.apk
          cp "$SOURCE" "dist/VoxelOps-${{ steps.meta.outputs.version }}-build${{ github.run_number }}.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: voxelops-apk-${{ github.run_number }}
          path: dist/
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push' && contains(env.RELEASE_BRANCHES, github.ref_name)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="VoxelOps ${VERSION} (build ${GITHUB_RUN_NUMBER}) built from commit ${GITHUB_SHA} on branch ${GITHUB_REF_NAME}.

          Install: download VoxelOps.apk and open it on your Android phone (Android 7.0 or newer).
          Verify: compare the SHA-256 in SHA256SUMS.txt."
          if gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "VoxelOps ${VERSION} (build ${GITHUB_RUN_NUMBER})" --notes "$NOTES" --latest; then
            echo "Published release ${TAG}."
          else
            echo "Release creation failed; attempting to upload assets to existing tag." >&2
            gh release upload "$TAG" dist/* --clobber
          fi
