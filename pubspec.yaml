name: voxelops
description: "VoxelOps - a native Flutter control center for Minecraft servers that run on GitHub Actions, persist to Google Drive and join a Tailscale network."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Networking & security
  http: ^1.5.0
  flutter_appauth: ^12.1.0
  flutter_secure_storage: ^10.3.4
  pinenacl: ^0.6.0
  crypto: ^3.0.5

  # Persistence & platform
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

  # Media & files
  image: ^4.10.1
  image_picker: ^1.2.4
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/runtime/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
